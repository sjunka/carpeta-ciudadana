# Mi Carpeta Segura en local: docker compose up -d --build
# Keycloak 8081 · afiliación 8082 · custodia 8083 (también /api/transferCitizen) · pasarela 8084 · MinIO 9000 (consola 9001)
name: mcs

x-node: &node
  restart: unless-stopped
  environment: &comun
    ORIGENES: http://localhost:5173,http://localhost:4173

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_CLAVE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-bases.sql:/docker-entrypoint-initdb.d/init-bases.sql:ro
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  bucket:
    image: quay.io/minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $S3_ACCESS_KEY $S3_SECRET_KEY &&
             mc mb --ignore-existing local/mcs-documentos"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  keycloak:
    build: ./identidad
    command: ["start", "--optimized", "--import-realm", "--http-enabled=true"]
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${PG_CLAVE}
      # iss externo para el navegador; los servicios entran por la red interna.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_CLAVE}
      KC_AFILIACION_SECRETO: ${KC_AFILIACION_SECRETO}
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30

  pasarela:
    <<: *node
    build: ./servicios/pasarela
    environment:
      GOVCARPETA_URL: https://govcarpeta-apis-4905ff3c005b.herokuapp.com
      OPERADOR_ID: ${OPERADOR_ID}
      OPERADOR_NOMBRE: Mi Carpeta Segura
      URL_SOLO_HTTPS: "false"
    ports: ["8084:8080"]

  migrar-afiliacion:
    build: ./servicios/afiliacion
    command: ["node", "src/server.js", "--migrar"]
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/afiliacion

  migrar-custodia:
    build: ./servicios/custodia
    command: ["node", "src/server.js", "--migrar"]
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/custodia

  afiliacion:
    <<: *node
    build: ./servicios/afiliacion
    depends_on:
      migrar-afiliacion: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    environment:
      <<: *comun
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/afiliacion
      PASARELA_URL: http://pasarela:8080
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_SECRETO: ${KC_AFILIACION_SECRETO}
      CLAVE_INTERNA: ${CLAVE_INTERNA}
    ports: ["8082:8080"]

  custodia:
    <<: *node
    build: ./servicios/custodia
    depends_on:
      migrar-custodia: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      bucket: { condition: service_completed_successfully }
    environment:
      <<: *comun
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/custodia
      PASARELA_URL: http://pasarela:8080
      KEYCLOAK_ISSUER: http://localhost:8081/realms/carpeta
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/carpeta/protocol/openid-connect/certs
      S3_ENDPOINT: http://minio:9000
      S3_ENDPOINT_PUBLICO: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: mcs-documentos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Traslado entre operadores (MS-07 dentro de custodia en el prototipo).
      AFILIACION_URL: http://afiliacion:8080
      CLAVE_INTERNA: ${CLAVE_INTERNA}
      OPERADOR_ID: ${OPERADOR_ID}
      OPERADOR_NOMBRE: Mi Carpeta Segura
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:8083}
      URL_SOLO_HTTPS: "false"
    ports: ["8083:8080"]

volumes:
  pgdata:
  miniodata:
