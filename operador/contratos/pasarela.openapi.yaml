openapi: 3.1.0
info:
  title: Pasarela del centralizador (MS-08)
  version: 0.1.0
  description: Capa anticorrupción sobre GovCarpeta. Nunca acepta contenido documental (RI-01).
servers:
  - url: http://localhost:8084
paths:
  /centralizador/ciudadanos/{id}:
    get:
      summary: Consulta la afiliación (validateCitizen)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9]{6,10}$' } }
      responses:
        '200':
          description: Resultado normalizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  afiliado: { type: boolean }
                  operador: { type: [string, 'null'] }
        '503': { $ref: '#/components/responses/Problema' }
    delete:
      summary: Da de baja al ciudadano en el centralizador (unregisterCitizen) para trasladarlo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9]{6,10}$' } }
      responses:
        '204': { description: Ciudadano libre en GovCarpeta }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /centralizador/ciudadanos:
    post:
      summary: Registra al ciudadano (registerCitizen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, nombre, direccion, correo]
              properties:
                id: { type: string }
                nombre: { type: string }
                direccion: { type: string }
                correo: { type: string, format: email }
      responses:
        '201': { description: Registrado }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /centralizador/operadores:
    get:
      summary: Operadores que publican transferAPIURL (getOperators)
      responses:
        '200':
          description: Directorio normalizado
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    nombre: { type: string }
                    transferAPIURL: { type: string, format: uri }
        '503': { $ref: '#/components/responses/Problema' }
  /centralizador/documentos/autenticacion:
    put:
      summary: Autentica un documento por URL (authenticateDocument)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idCiudadano, url, titulo]
              properties:
                idCiudadano: { type: string }
                url: { type: string, format: uri, pattern: '^https://' }
                titulo: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Respuesta normalizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  autenticado: { type: boolean }
                  respuesta: { type: string }
        '400': { $ref: '#/components/responses/Problema' }
        '413': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      summary: Chequeo de salud
      responses:
        '200': { description: Servicio sano }
components:
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
