openapi: 3.1.0
info:
  title: Custodia documental (MS-04)
  version: 0.1.0
  description: Documentos del ciudadano. Realiza HU-02, HU-03, HU-04 y el inicio de HU-13. Todas las rutas salvo /salud y las /api/* del contrato de interoperabilidad exigen Bearer JWT de Keycloak con aud custodia.
servers:
  - url: http://localhost:8083
security:
  - bearer: []
paths:
  /documentos:
    get:
      summary: Lista los documentos del titular
      responses:
        '200':
          description: Documentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Problema' }
    post:
      summary: Registra un documento pendiente y entrega una URL PUT de 5 minutos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo, tamano]
              properties:
                titulo: { type: string, maxLength: 120 }
                tipo: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                tamano: { type: integer, maximum: 10485760 }
      responses:
        '201':
          description: Pendiente de carga
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  urlCarga: { type: string, format: uri }
        '413': { $ref: '#/components/responses/Problema' }
        '415': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /documentos/{id}/confirmacion:
    post:
      summary: Verifica el objeto subido y lo marca cargado
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cargado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /documentos/{id}/autenticacion:
    post:
      summary: Pide a GovCarpeta autenticar el documento con una URL GET de 15 minutos
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Autenticado por el centralizador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /operadores:
    get:
      summary: Operadores destino que publican transferAPIURL, sin incluirnos
      responses:
        '200':
          description: Operadores
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    nombre: { type: string }
        '401': { $ref: '#/components/responses/Problema' }
  /traslados:
    post:
      summary: El titular inicia su traslado a otro operador (HU-13)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operadorId]
              properties:
                operadorId: { type: string }
      responses:
        '202':
          description: Enviado; la carpeta queda en solo lectura hasta la confirmación
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, enum: [enviado] }
                  operador: { type: string }
                  documentos: { type: integer }
        '401': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      security: []
      summary: Chequeo de salud
      responses:
        '200': { description: Servicio sano }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Documento:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        tipo: { type: string }
        tamano: { type: integer }
        sha256: { type: string }
        estado: { type: string, enum: [pendiente, cargado, autenticado] }
        autenticacion:
          type: object
          properties:
            fecha: { type: string, format: date-time }
            respuesta: { type: string }
        creado: { type: string, format: date-time }
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
